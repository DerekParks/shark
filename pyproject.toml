[project]
name = "shark"
version = "0.2.0"
description = "Record scheduled radio broadcasts with a Griffin RadioSHARK and publish them as a podcast"
readme = "README"
requires-python = ">=3.13"
dependencies = [
    "docopt-ng>=0.9",
    "fastapi>=0.115",
    "feedgen>=1.0",
    "httpx2>=2.13.1",
    "mutagen>=1.47",
    "python-dateutil>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    {include-group = "enhance-core"},
]
enhance-core = [
    "numpy>=2",
    "scipy>=1.14",
    "soundfile>=0.13",
]
enhance = [
    {include-group = "enhance-core"},
    "huggingface-hub>=0.30",
    "lavasr",
    "torch==2.9.1",
    "torchaudio==2.9.1",
]

[tool.uv]
package = false

[tool.uv.sources]
lavasr = { git = "https://github.com/ysharma3501/LavaSR.git", rev = "33ac040892519c1bb4aed7eb32e79af51cc29e2a" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
